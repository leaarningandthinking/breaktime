<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","SF Pro Text",Helvetica,sans-serif}
body{background:radial-gradient(130% 130% at 50% 0%,#6b5320 0%,#33270e 48%,#191207 100%);
     color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.orb{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;
     border:2px solid rgba(255,214,107,.55);box-shadow:0 0 42px rgba(255,196,60,.22);
     animation:breathe 5s ease-in-out infinite}
.orb span{font-size:42px}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.04)}}
h1{margin:0;font-size:30px;font-weight:700;color:#ffd66b;letter-spacing:3px}
p{margin:0;font-size:16px;opacity:.86;line-height:1.6;letter-spacing:.5px}
.seq{margin-top:2px;font-size:22px;letter-spacing:6px;opacity:.95}
</style></head><body>
  <div class="orb"><span>&#128064;</span></div>
  <h1>&#30524;&#30555;&#21644;&#32937;&#33152;</h1>
  <p>&#32824;&#32824;&#32937;&#8230;&#8230;&#28982;&#21518;&#25918;&#26494;&#12290;<br>&#35753;&#30524;&#30555;&#24930;&#24930;&#36716;&#19968;&#22280;&#12290;</p>
  <div class="seq">&#128064; &#8596; &#129485; &#8596; &#9995;</div>
</body></html>
