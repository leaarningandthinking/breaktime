<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","SF Pro Text",Helvetica,sans-serif}
body{background:radial-gradient(130% 130% at 50% 0%,#1f6b58 0%,#0d3830 46%,#071c18 100%);
     color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px}
.orb{width:124px;height:124px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
     border:2px solid rgba(255,255,255,.30);animation:breathe 7s ease-in-out infinite}
.orb:after{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(120,235,200,.28);
     animation:breathe 7s ease-in-out infinite}
.orb span{font-size:42px}
@keyframes breathe{0%,100%{transform:scale(.86);opacity:.72}50%{transform:scale(1.02);opacity:1}}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:3px}
p{margin:0;font-size:16px;opacity:.84;line-height:1.6;letter-spacing:.5px}
.tip{font-size:13px;letter-spacing:4px;color:#8fe4c8;opacity:.95}
</style></head><body>
  <div class="orb"><span>&#127807;</span></div>
  <h1>&#31163;&#24320;&#23631;&#24149;&#19968;&#20250;&#20799;</h1>
  <p>&#30475;&#30475;&#36828;&#26041; &middot; &#20280;&#23637;&#19968;&#19979; &middot; &#28145;&#21628;&#21560;<br>&#35753;&#30524;&#30555;&#27463;&#19968;&#20250;&#20799;&#12290;</p>
  <div class="tip">&#25918;&#26494;</div>
</body></html>
